# CI: all tests run here, never on the dev machine (local Dart/Jest runs crash it).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Cloud Functions (build + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # lib/firebase_options.dart is gitignored (generated by flutterfire);
      # tests don't touch Firebase, so a stub is enough to compile main.dart.
      - name: Stub firebase_options.dart
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci',
                  appId: 'ci',
                  messagingSenderId: 'ci',
                  projectId: 'ci',
                );
          }
          EOF
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
